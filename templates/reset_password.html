{% extends "base.html" %}

{% block title %}Reset password{% endblock %}

{% block content %}
    <h1>Choose a new password</h1>

    <form class="account-form" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>
            New password (8–128 characters)
            <input name="password" type="password" required minlength="8" maxlength="128" autocomplete="new-password">
        </label>
        <label>
            Confirm new password
            <input name="password_confirmation" type="password" required minlength="8" maxlength="128" autocomplete="new-password">
        </label>
        <button type="submit">Update password</button>
    </form>
{% endblock %}
